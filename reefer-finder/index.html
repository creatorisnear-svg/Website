<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reefer Load Finder</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--mute:#94a3b8;--acc:#38bdf8;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif;padding:16px;max-width:1100px;margin-inline:auto}
  h1{margin:0 0 4px} .sub{color:var(--mute);margin-bottom:16px}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--card);padding:14px;border-radius:12px;margin-bottom:16px}
  label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:4px}
  input,select{background:var(--bg);color:var(--text);border:1px solid #334155;border-radius:8px;padding:8px;font-size:15px}
  .stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;color:var(--mute)} .stats b{color:var(--text)}
  .load{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:8px;border-left:5px solid var(--mute)}
  .load.hot{border-left-color:var(--good)} .load.ok{border-left-color:var(--warn)}
  .route{font-weight:600;font-size:16px} .meta{color:var(--mute);font-size:13px;margin-top:4px}
  .pay{text-align:right} .pay .total{font-size:22px;font-weight:700} .pay .rpm{color:var(--acc)}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#334155;margin-right:4px}
  .tag.hot{background:var(--good);color:#04210f} .tag.warn{background:var(--bad)}
  button{background:var(--acc);color:#04202e;border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
  .err{color:var(--bad)}
</style>
</head>
<body>
<h1>Reefer Load Finder</h1>
<div class="sub">Ranks refrigerated loads by what you actually take home. <span id="srcnote"></span></div>

<div class="filters">
  <label>Origin state<input id="origin" placeholder="e.g. CA (blank = any)" maxlength="2"></label>
  <label>Dest state<input id="dest" placeholder="blank = any" maxlength="2"></label>
  <label>Min $/mile<input id="minRpm" type="number" step="0.05" value="2.50"></label>
  <label>Min total $<input id="minTotal" type="number" step="100" value="1500"></label>
  <label>Max deadhead (mi)<input id="maxDh" type="number" value="100"></label>
  <label>Cost per mile $ (fuel+running)<input id="cpm" type="number" step="0.05" value="1.60"></label>
  <label>Sort by<select id="sort"><option value="profit">Profit</option><option value="rpm">$/mile</option><option value="total">Total pay</option><option value="fresh">Newest</option></select></label>
  <label>&nbsp;<button id="refresh">Refresh loads</button></label>
</div>

<div class="stats" id="stats"></div>
<div id="list"></div>

<script src="source.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = "reefer-finder-settings";
const fields = ["origin","dest","minRpm","minTotal","maxDh","cpm","sort"];
let all = [];

try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); fields.forEach(f => { if (s[f] !== undefined) $(f).value = s[f]; }); } catch(e){}

function evaluate(l, cpm){
  const paidMiles = l.miles + l.deadhead;           // you drive the deadhead too
  const rpm = l.rate / l.miles;                     // advertised
  const trueRpm = l.rate / paidMiles;               // including deadhead
  const profit = l.rate - paidMiles * cpm;
  return {...l, rpm, trueRpm, profit, profitPerMile: profit / paidMiles};
}

function render(){
  try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(fields.map(f => [f, $(f).value])))); } catch(e){}
  const v = f => $(f).value.trim();
  const o = v("origin").toUpperCase(), d = v("dest").toUpperCase();
  const cpm = +v("cpm") || 0;
  let rows = all.map(l => evaluate(l, cpm)).filter(l =>
    (!o || l.origin.st === o) && (!d || l.dest.st === d) &&
    l.trueRpm >= (+v("minRpm") || 0) && l.rate >= (+v("minTotal") || 0) && l.deadhead <= (+v("maxDh") || 1e9));
  const sorters = {profit:(a,b)=>b.profit-a.profit, rpm:(a,b)=>b.rpm-a.rpm, total:(a,b)=>b.rate-a.rate, fresh:(a,b)=>a.postedMins-b.postedMins};
  rows.sort(sorters[v("sort")]);

  const avg = rows.length ? rows.reduce((s,l)=>s+l.trueRpm,0)/rows.length : 0;
  $("stats").innerHTML = `<span><b>${rows.length}</b> of ${all.length} loads match</span><span>Avg $/mi incl. deadhead: <b>$${avg.toFixed(2)}</b></span>` +
    (rows[0] ? `<span>Best profit: <b>$${Math.round(rows[0].profit).toLocaleString()}</b></span>` : "");

  $("list").innerHTML = rows.map(l => {
    const cls = l.profitPerMile >= 1.2 ? "hot" : l.profitPerMile >= 0.7 ? "ok" : "";
    return `<div class="load ${cls}">
      <div>
        <div class="route">${l.origin.city}, ${l.origin.st} → ${l.dest.city}, ${l.dest.st}</div>
        <div class="meta">${l.miles} mi · ${l.deadhead} mi deadhead · ${l.weight.toLocaleString()} lb · ${l.commodity} @ ${l.temp}°F · pickup ${l.pickup}</div>
        <div class="meta">${l.broker} · ${l.phone} · posted ${l.postedMins} min ago</div>
        <div style="margin-top:6px">
          ${cls==="hot"?'<span class="tag hot">HIGH PAY</span>':""}
          ${l.deadhead>75?'<span class="tag warn">long deadhead</span>':""}
          ${l.postedMins<30?'<span class="tag">fresh</span>':""}
        </div>
      </div>
      <div class="pay">
        <div class="total">$${l.rate.toLocaleString()}</div>
        <div class="rpm">$${l.rpm.toFixed(2)}/mi (${l.trueRpm.toFixed(2)} w/ deadhead)</div>
        <div class="meta">est. profit $${Math.round(l.profit).toLocaleString()}</div>
      </div>
    </div>`;
  }).join("") || '<div class="meta">No loads match. Try lowering the minimums.</div>';
}

async function load(){
  try {
    all = await getLoads();
    $("srcnote").textContent = typeof LIVE_URL !== "undefined" && LIVE_URL ? "(live feed)" : "(SAMPLE DATA – not real loads)";
    render();
  } catch(e){ $("list").innerHTML = `<div class="err">Could not load: ${e.message}</div>`; }
}
fields.forEach(f => $(f).addEventListener("input", render));
$("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
